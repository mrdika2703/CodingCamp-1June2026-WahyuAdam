<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <span id="clock" class="clock"></span>
      <span id="date-display" class="date"></span>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="btn-icon" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="dashboard">

    <!-- Greeting -->
    <section class="card greeting-card">
      <div class="greeting-content">
        <h1 id="greeting-text">Good morning!</h1>
        <p class="greeting-sub">Have a productive day.</p>
      </div>
      <div class="greeting-name">
        <span id="name-display" class="name-text"></span>
        <button id="edit-name-btn" class="btn-icon" title="Edit name">✏️</button>
      </div>
      <!-- Name modal -->
      <div id="name-modal" class="modal hidden">
        <div class="modal-box">
          <h3>What's your name?</h3>
          <input id="name-input" type="text" placeholder="Enter your name..." maxlength="30" />
          <div class="modal-actions">
            <button id="save-name-btn" class="btn btn-primary">Save</button>
            <button id="cancel-name-btn" class="btn btn-ghost">Cancel</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Grid: Timer + Quick Links -->
    <div class="grid-2">

      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2 class="card-title">🎯 Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">Start</button>
          <button id="timer-stop" class="btn btn-secondary" disabled>Stop</button>
          <button id="timer-reset" class="btn btn-ghost">Reset</button>
        </div>
        <div class="timer-status" id="timer-status">Ready</div>
      </section>

      <!-- Quick Links -->
      <section class="card links-card">
        <div class="card-header">
          <h2 class="card-title">🔗 Quick Links</h2>
          <button id="add-link-btn" class="btn btn-small btn-primary">+ Add</button>
        </div>
        <div id="links-list" class="links-list"></div>
        <!-- Add link form -->
        <div id="link-form" class="link-form hidden">
          <input id="link-name-input" type="text" placeholder="Label (e.g. GitHub)" maxlength="20" />
          <input id="link-url-input" type="url" placeholder="https://..." />
          <div class="form-actions">
            <button id="save-link-btn" class="btn btn-primary btn-small">Save</button>
            <button id="cancel-link-btn" class="btn btn-ghost btn-small">Cancel</button>
          </div>
        </div>
      </section>

    </div>

    <!-- To-Do List -->
    <section class="card todo-card">
      <div class="card-header">
        <h2 class="card-title">✅ To-Do List</h2>
        <div class="todo-controls">
          <select id="sort-select" class="select">
            <option value="created">Sort: Newest</option>
            <option value="created-asc">Sort: Oldest</option>
            <option value="alpha">Sort: A–Z</option>
            <option value="done">Sort: Done Last</option>
          </select>
        </div>
      </div>

      <!-- Add task -->
      <div class="todo-input-row">
        <input id="todo-input" type="text" placeholder="Add a new task..." maxlength="120" />
        <button id="todo-add-btn" class="btn btn-primary">Add</button>
      </div>

      <!-- Task list -->
      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty-msg hidden">No tasks yet. Add one above!</p>
    </section>

  </main>

  <script src="js/app.js"></script>
</body>
</html>
